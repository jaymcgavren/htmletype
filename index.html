<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>kiosk</title>
<style>
  /* ---- Tunable colors (change these two lines to re-theme) ---- */
  :root {
    --fg: #00ff00;   /* bright green text       */
    --bg: #000000;   /* black background        */
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  #screen {
    box-sizing: border-box;
    margin: 0;
    padding: 1rem;
    width: 100%;
    height: 100%;
    color: var(--fg);
    background: var(--bg);
    font-family: "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace;
    font-size: 72px;
    line-height: 1.3;
    white-space: pre-wrap;     /* wrap long lines, preserve newlines */
    word-break: break-word;
    overflow: hidden;          /* we trim old text instead of scrolling */
  }

  /* Solid block cursor that hard-blinks like a terminal. */
  #cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.05em;
    margin-left: 1px;
    background: var(--fg);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 50%   { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
  <pre id="screen"><span id="text"></span><span id="cursor"></span></pre>

  <script>
  (function () {
    "use strict";

    // ----------------------------------------------------------------
    //  Configuration
    // ----------------------------------------------------------------
    var SNIPPETS = [
      "Our current Open Hours schedule is\nMon-Wed 7pm-10pm\nSat 12pm-5pm\nSee our calendar at https://heatsynclabs.org",
      "We are a hackerspace/makerspace! We're a community workshop where people can come to create prototypes, art, and projects.",
      "We are primarily supported by donations of time and money, and member dues.",
      "During open hours, the public can use the space entirely free of charge. But donations are appreciated!",
      "Check our calendar at https://heatsynclabs.org for upcoming events!",
      "Our volunteers run classes and workshops! Check the calendar at https://heatsynclabs.org",
      "Coffee and Coworking is every Wednesday from 9am-3pm. Bring a laptop and work together!",
      "Our laser cutter station features 60 watt and 80 watt cutters! Certification required, check the calendar for classes.",
      "The Quantum Engineering station changes when observed. Please stop looking at it!",
      "At our vinyl cutter station, you can cut stickers, t-shirt transfers, and more!",
      "Stations in the lab include 3D Printing, Vinyl Cutting, Wood Shop, Metal Shop, and more!",
      "Each station is lovingly maintained by one or more volunteer Station Champions. If you see them, thank them!",
      "How does the lab work? Check our wiki! https://wiki.heatsynclabs.org",
      "Please share photos of your projects with us. We'd love to share them on our social media!",
      "Our laser cutters can cut and etch plywood, acrylic, and more! Certification required, check the calendar for classes.",
      "We provide a friendly and safe environment for all!"
    ];

    var TYPE_DELAY_MS    = 10;   // base delay between characters
    var TYPE_JITTER_MS   = 5;    // random extra delay (0..this) per char
    var PAUSE_AFTER_MS   = 5000; // pause after a snippet finishes, before clearing

    // ----------------------------------------------------------------
    //  Engine
    // ----------------------------------------------------------------
    var textEl   = document.getElementById("text");
    var textNode = document.createTextNode("");
    textEl.appendChild(textNode);

    var snippetIndex = 0;
    var charIndex    = 0;

    function step() {
      var snippet = SNIPPETS[snippetIndex];

      if (charIndex < snippet.length) {
        textNode.appendData(snippet.charAt(charIndex));
        charIndex++;
        setTimeout(step, TYPE_DELAY_MS + Math.random() * TYPE_JITTER_MS);
      } else {
        // Finished this snippet: pause, then clear the screen and move on.
        setTimeout(function () {
          textNode.data = "";
          charIndex = 0;
          snippetIndex = (snippetIndex + 1) % SNIPPETS.length;
          step();
        }, PAUSE_AFTER_MS);
      }
    }

    step();
  })();
  </script>
</body>
</html>
