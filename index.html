<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>kiosk</title>
<style>
  /* ---- Tunable colors (change these two lines to re-theme) ---- */
  :root {
    --fg: #00ff00;   /* bright green text       */
    --bg: #000000;   /* black background        */
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  #screen {
    box-sizing: border-box;
    margin: 0;
    padding: 1rem;
    width: 100%;
    height: 100%;
    color: var(--fg);
    background: var(--bg);
    font-family: "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace;
    font-size: 1.6rem;
    line-height: 1.3;
    white-space: pre-wrap;     /* wrap long lines, preserve newlines */
    word-break: break-word;
    overflow: hidden;          /* we trim old text instead of scrolling */
  }

  /* Solid block cursor that hard-blinks like a terminal. */
  #cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.05em;
    margin-left: 1px;
    background: var(--fg);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 50%   { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
  <pre id="screen"><span id="text"></span><span id="cursor"></span></pre>

  <script>
  (function () {
    "use strict";

    // ----------------------------------------------------------------
    //  Configuration
    // ----------------------------------------------------------------
    var SNIPPETS = [
      "Initializing system...",
      "Loading kernel modules [ OK ]",
      "Mounting filesystems [ OK ]",
      "Starting network services [ OK ]",
      "for (let i = 0; i < n; i++) { sum += data[i]; }",
      "git commit -m \"ship it\"",
      "All systems nominal.",
      "Awaiting input_"
    ];

    var TYPE_DELAY_MS    = 45;   // base delay between characters
    var TYPE_JITTER_MS   = 35;   // random extra delay (0..this) per char
    var PAUSE_AFTER_MS   = 900;  // pause after a snippet finishes
    var MAX_CHARS        = 4000; // scrollback cap (keeps the DOM small)

    // ----------------------------------------------------------------
    //  Engine
    // ----------------------------------------------------------------
    var textEl   = document.getElementById("text");
    var textNode = document.createTextNode("");
    textEl.appendChild(textNode);

    var snippetIndex = 0;
    var charIndex    = 0;
    var first        = true;

    function trim() {
      // Keep the text node bounded so it runs forever without bloating.
      var d = textNode.data;
      if (d.length > MAX_CHARS) {
        var cut = d.slice(d.length - MAX_CHARS);
        var nl  = cut.indexOf("\n");           // align trim to a line break
        textNode.data = nl >= 0 ? cut.slice(nl + 1) : cut;
      }
    }

    function step() {
      var snippet = SNIPPETS[snippetIndex];

      if (charIndex === 0) {
        if (!first) { textNode.appendData("\n"); }
        first = false;
      }

      if (charIndex < snippet.length) {
        textNode.appendData(snippet.charAt(charIndex));
        charIndex++;
        setTimeout(step, TYPE_DELAY_MS + Math.random() * TYPE_JITTER_MS);
      } else {
        // Finished this snippet: advance and pause.
        trim();
        charIndex = 0;
        snippetIndex = (snippetIndex + 1) % SNIPPETS.length;
        setTimeout(step, PAUSE_AFTER_MS);
      }
    }

    step();
  })();
  </script>
</body>
</html>
